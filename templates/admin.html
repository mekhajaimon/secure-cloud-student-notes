<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #141e30, #243b55);
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.35);
        }

        .stat-card {
            background: white;
            color: #111827;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 8px 22px rgba(0,0,0,0.25);
        }

        .stat-number {
            font-size: 45px;
            font-weight: bold;
            color: #0072ff;
        }

        .stat-title {
            font-size: 18px;
            color: #555;
        }

        .btn-custom {
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">
            Student Notes Admin Panel
        </a>

        <div>
            <a href="/dashboard" class="btn btn-outline-light btn-custom me-2">
                Dashboard
            </a>
            <a href="/logout" class="btn btn-danger btn-custom">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="dashboard-card">

        <h1 class="text-center fw-bold mb-2">
            Admin Dashboard
        </h1>

        <p class="text-center text-light mb-5">
            Overview of users and notes in the Student Notes Management System
        </p>

        <div class="row g-4 justify-content-center">

            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number">
                        {{ total_users }}
                    </div>
                    <div class="stat-title">
                        Total Registered Users
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number">
                        {{ total_notes }}
                    </div>
                    <div class="stat-title">
                        Total Notes Created
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center mt-5">
            <a href="/dashboard" class="btn btn-primary btn-custom">
                Back to User Dashboard
            </a>
        </div>

    </div>

</div>

</body>
</html>
