<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            min-height: 100vh;
            color: white;
        }

        .dashboard-card{
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        .main-title{
            font-weight: bold;
            margin-bottom: 15px;
        }

        .subtitle{
            color: #dcdcdc;
            margin-bottom: 35px;
        }

        .btn-custom{
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            margin: 10px;
            transition: 0.3s;
        }

        .btn-custom:hover{
            transform: scale(1.05);
        }

        .btn-add{
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
        }

        .btn-view{
            background: linear-gradient(to right, #56ab2f, #a8e063);
            color: white;
        }

        .btn-logout{
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
        }

    </style>

</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="col-md-7">

        <div class="dashboard-card">

            <h1 class="main-title">
                Welcome to Student Notes Dashboard 🎓
            </h1>

            <p class="subtitle">
                Manage your study materials and academic notes efficiently.
            </p>

            <div>

                <a href="/add_note" class="btn btn-custom btn-add">
                    Add Notes 📝
                </a>

                <a href="/view_notes" class="btn btn-custom btn-view">
                    View Notes 📚
                </a>

                <a href="/logout" class="btn btn-custom btn-logout">
                    Logout 🚪
                </a>
                <a href="/admin" class="btn btn-warning">
                Admin Dashboard
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
