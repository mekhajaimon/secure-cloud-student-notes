<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            min-height: 100vh;
            color: white;
        }

        .edit-card{
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        .form-control{
            border-radius: 12px;
            padding: 12px;
        }

        textarea{
            resize: none;
        }

        .btn-update{
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            border-radius: 30px;
            padding: 12px;
            color: white;
            font-weight: bold;
        }

        .btn-update:hover{
            transform: scale(1.03);
            transition: 0.3s;
        }

    </style>

</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="edit-card">

                <h1 class="text-center mb-4">
                    Edit Note ✏️
                </h1>

                <form method="POST">

                    <div class="mb-4">

                        <label class="mb-2">Note Title</label>

                        <input type="text"
                               class="form-control"
                               name="title"
                               value="{{ note[1] }}"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="mb-2">Note Content</label>

                        <textarea class="form-control"
                                  rows="6"
                                  name="content"
                                  required>{{ note[2] }}</textarea>

                    </div>

                    <button type="submit" class="btn btn-update w-100">
                        Update Note
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
