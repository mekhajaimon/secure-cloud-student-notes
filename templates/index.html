
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: rgba(0,0,0,0.8);
        }

        .hero-section {
            margin-top: 80px;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        .main-title {
            font-size: 55px;
            font-weight: bold;
            color: #0d1b2a;
        }

        .subtitle {
            font-size: 22px;
            color: #555;
            margin-top: 20px;
        }

        .custom-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            border: none;
            transition: 0.3s;
        }

        .custom-btn:hover {
            transform: scale(1.05);
        }
    </style>

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            Student Notes Management System
        </a>

        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/login" class="btn btn-outline-info me-2">
                Login
            </a>

            <a href="/register" class="btn btn-info">
                Register
            </a>

        </div>

    </div>
</nav>

    <div class="container hero-section">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="main-card text-center">

                    <h1 class="main-title">
                        Welcome to Student Notes Management System
                    </h1>

                    <p class="subtitle">
                        Secure Cloud-Based Platform for Sharing and Managing Student Notes
                    </p>

                    <button class="btn btn-primary custom-btn">
                        Get Started
                    </button>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
